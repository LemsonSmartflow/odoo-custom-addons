name: car-rental-local

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo-test
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    image: odoo:19.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8070:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo-test
    volumes:
      - ./car_rental_management_odoo:/mnt/extra-addons/car_rental_management_odoo:ro
      - odoo-data:/var/lib/odoo
    command:
      - --addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
      - --db_host=db
      - --db_user=odoo
      - --db_password=odoo-test
      - --database=odoo_test
      - --http-interface=0.0.0.0
      - --http-port=8069

volumes:
  db-data:
  odoo-data:
